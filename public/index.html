<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLMOJI, tu LLM santiaguino</title>
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --header: #0f172a;
    --header-soft: #1f2937;
    --line: #d9dee7;
    --text: #172033;
    --muted: #6b7280;
    --bot: #ffffff;
    --user: #daf2dc;
    --accent: #128c7e;
    --accent-dark: #0b6f64;
  }

  * { box-sizing: border-box; }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:
      linear-gradient(135deg, rgba(18, 140, 126, 0.12), transparent 34%),
      linear-gradient(225deg, rgba(15, 23, 42, 0.12), transparent 38%),
      var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 20px;
  }

  #app {
    width: min(100%, 780px);
    height: min(860px, calc(100dvh - 40px));
    min-height: 520px;
    background: var(--panel);
    border: 1px solid rgba(15, 23, 42, 0.08);
    border-radius: 8px;
    box-shadow: 0 24px 70px rgba(15, 23, 42, 0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: linear-gradient(180deg, var(--header), var(--header-soft));
    color: white;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0;
    color: white;
    background: linear-gradient(135deg, #128c7e, #38b2ac);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
  }

  .header-copy {
    min-width: 0;
  }

  .app-title {
    font-size: 17px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: 0;
  }

  .app-status {
    margin-top: 3px;
    font-size: 12px;
    color: #cbd5e1;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background:
      linear-gradient(rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.76)),
      repeating-linear-gradient(135deg, #edf1f5 0, #edf1f5 1px, transparent 1px, transparent 16px);
  }

  #chat::-webkit-scrollbar {
    width: 10px;
  }

  #chat::-webkit-scrollbar-thumb {
    background: #c8d0dc;
    border: 3px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
  }

  .message {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 88%;
    animation: pop 0.16s ease-out;
  }

  .message.user-row {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .message.bot-row,
  .message.sticker-row,
  .message.typing-row {
    align-self: flex-start;
  }

  .message-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 700;
    color: white;
    background: #475569;
  }

  .user-row .message-avatar {
    background: #128c7e;
  }

  .message-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .user-row .message-body {
    align-items: flex-end;
  }

  .bubble {
    max-width: min(100%, 520px);
    padding: 10px 13px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.45;
    word-break: break-word;
    overflow-wrap: anywhere;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user {
    background: var(--user);
    border-bottom-right-radius: 5px;
  }

  .bot {
    background: var(--bot);
    border: 1px solid rgba(15, 23, 42, 0.06);
    border-bottom-left-radius: 5px;
  }

  .stamp {
    color: var(--muted);
    font-size: 11px;
    padding: 0 4px;
  }

  .sticker-wrap {
    padding: 0;
    background: transparent;
    box-shadow: none;
    border: none;
  }

  .sticker-wrap img {
    max-width: 170px;
    max-height: 170px;
    width: auto;
    height: auto;
    display: block;
    border-radius: 8px;
  }

  .typing {
    width: 68px;
    padding: 12px 14px;
    display: flex;
    gap: 5px;
    align-items: center;
    justify-content: center;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #94a3b8;
    animation: blink 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) {
    animation-delay: 0.16s;
  }

  .typing span:nth-child(3) {
    animation-delay: 0.32s;
  }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.35; transform: translateY(0); }
    40% { opacity: 1; transform: translateY(-2px); }
  }

  #inputBar {
    display: flex;
    align-items: center;
    padding: 14px;
    background: #f8fafc;
    border-top: 1px solid var(--line);
    gap: 10px;
  }

  #inputBar input {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    border-radius: 999px;
    border: 1px solid #d7dde6;
    background: white;
    font-size: 15px;
    outline: none;
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #inputBar input:focus {
    border-color: rgba(18, 140, 126, 0.72);
    box-shadow: 0 0 0 3px rgba(18, 140, 126, 0.12);
  }

  #inputBar button {
    min-width: 92px;
    height: 44px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  #inputBar button:hover:not(:disabled) {
    background: var(--accent-dark);
  }

  #inputBar button:active:not(:disabled) {
    transform: translateY(1px);
  }

  #inputBar button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
  }

  @media (max-width: 640px) {
    body {
      padding: 0;
    }

    #app {
      width: 100%;
      height: 100dvh;
      min-height: 100dvh;
      border-radius: 0;
      border: none;
    }

    #chat {
      padding: 16px 12px;
    }

    .message {
      max-width: 96%;
    }

    .message-avatar {
      display: none;
    }

    .bubble {
      max-width: min(100%, 86vw);
    }

    #inputBar {
      padding: 10px;
    }

    #inputBar button {
      min-width: 76px;
      padding: 0 14px;
    }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">LL</div>
    <div class="header-copy">
      <div class="app-title">LLMOJI, tu LLM santiaguino</div>
      <div class="app-status">Activo ahora</div>
    </div>
  </header>
  <div id="chat"></div>
  <div id="inputBar">
    <input id="input" type="text" placeholder="Escribe algo..." autocomplete="off">
    <button id="sendBtn">Enviar</button>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sessionId = 'session-' + Math.random().toString(36).slice(2);

function currentTime() {
  return new Intl.DateTimeFormat('es-CL', {
    hour: '2-digit',
    minute: '2-digit'
  }).format(new Date());
}

function scrollChat() {
  chat.scrollTop = chat.scrollHeight;
}

function addBubble(text, cls) {
  const row = document.createElement('div');
  row.className = `message ${cls}-row`;

  const avatar = document.createElement('div');
  avatar.className = 'message-avatar';
  avatar.textContent = cls === 'user' ? 'TU' : 'LL';

  const body = document.createElement('div');
  body.className = 'message-body';

  const div = document.createElement('div');
  div.className = 'bubble ' + cls;
  div.textContent = text;

  const stamp = document.createElement('div');
  stamp.className = 'stamp';
  stamp.textContent = currentTime();

  body.appendChild(div);
  body.appendChild(stamp);
  row.appendChild(avatar);
  row.appendChild(body);
  chat.appendChild(row);
  scrollChat();
}

function addSticker(filename) {
  const row = document.createElement('div');
  row.className = 'message sticker-row';

  const avatar = document.createElement('div');
  avatar.className = 'message-avatar';
  avatar.textContent = 'LL';

  const body = document.createElement('div');
  body.className = 'message-body';

  const wrap = document.createElement('div');
  wrap.className = 'bubble sticker-wrap';

  const img = document.createElement('img');
  img.src = '/stickers/' + filename;
  img.alt = filename;

  const stamp = document.createElement('div');
  stamp.className = 'stamp';
  stamp.textContent = currentTime();

  wrap.appendChild(img);
  body.appendChild(wrap);
  body.appendChild(stamp);
  row.appendChild(avatar);
  row.appendChild(body);
  chat.appendChild(row);
  scrollChat();
}

function addTyping() {
  const row = document.createElement('div');
  row.className = 'message typing-row';
  row.id = 'typingIndicator';

  const avatar = document.createElement('div');
  avatar.className = 'message-avatar';
  avatar.textContent = 'LL';

  const div = document.createElement('div');
  div.className = 'bubble bot typing';
  div.setAttribute('aria-label', 'escribiendo');
  div.innerHTML = '<span></span><span></span><span></span>';

  row.appendChild(avatar);
  row.appendChild(div);
  chat.appendChild(row);
  scrollChat();
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addBubble(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: text, sessionId })
    });
    const data = await res.json();
    removeTyping();

    for (const m of data.mensajes) {
      await sleep(350);
      addBubble(m, 'bot');
    }

    await sleep(400);
    addSticker(data.sticker);
  } catch (err) {
    removeTyping();
    addBubble('uy, algo se rompió', 'bot');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
