<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLMOJI, tu LLM santiaguino</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #e5ddd5;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #075e54;
    color: white;
    padding: 14px 20px;
    font-weight: 600;
    font-size: 18px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bubble {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    animation: pop 0.15s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .user {
    align-self: flex-end;
    background: #dcf8c6;
    border-bottom-right-radius: 2px;
  }
  .bot {
    align-self: flex-start;
    background: white;
    border-bottom-left-radius: 2px;
  }
  .sticker-wrap {
    align-self: flex-start;
    padding: 0;
    background: transparent;
  }
  .sticker-wrap img {
    max-width: 150px;
    max-height: 150px;
    width: auto;
    height: auto;
    display: block;
  }
  .typing {
    align-self: flex-start;
    background: white;
    border-bottom-left-radius: 2px;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 15px;
    color: #999;
  }
  #inputBar {
    display: flex;
    padding: 10px;
    background: #f0f0f0;
    gap: 8px;
  }
  #inputBar input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 20px;
    border: none;
    font-size: 15px;
    outline: none;
  }
  #inputBar button {
    background: #075e54;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
  #inputBar button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
</style>
</head>
<body>
<header>LLMOJI, tu LLM santiaguino</header>
<div id="chat"></div>
<div id="inputBar">
  <input id="input" type="text" placeholder="Escribe algo..." autocomplete="off">
  <button id="sendBtn">Enviar</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sessionId = 'session-' + Math.random().toString(36).slice(2);

function addBubble(text, cls) {
  const div = document.createElement('div');
  div.className = 'bubble ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addSticker(filename) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble sticker-wrap';
  const img = document.createElement('img');
  img.src = '/stickers/' + filename;
  img.alt = filename;
  wrap.appendChild(img);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.textContent = 'escribiendo...';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addBubble(text, 'user');
  input.value = '';
  sendBtn.disabled = true;
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensaje: text, sessionId })
    });
    const data = await res.json();
    removeTyping();

    for (const m of data.mensajes) {
      await sleep(350);
      addBubble(m, 'bot');
    }

    await sleep(400);
    addSticker(data.sticker);
  } catch (err) {
    removeTyping();
    addBubble('uy, algo se rompió', 'bot');
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
